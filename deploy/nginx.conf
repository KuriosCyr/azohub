server {
    server_name azohub.bj www.azohub.bj 51.68.230.14;

    root /var/www/azohub/public;
    index index.php;

    client_max_body_size 20M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HSTS : dit au navigateur de ne plus jamais retenter en HTTP sur ce domaine pendant 1 an,
    # même si un lien/favori pointe vers http://. Sans ça, la redirection 301 ci-dessous protège
    # bien chaque requête individuelle, mais la toute première requête HTTP reste en clair.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    access_log /var/log/nginx/azohub-access.log;
    error_log /var/log/nginx/azohub-error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 120;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location = /favicon.ico { try_files $uri /index.php?$query_string; access_log off; log_not_found off; }
    location = /robots.txt { try_files $uri /index.php?$query_string; access_log off; log_not_found off; }

    # Sert directement les vrais fichiers statiques (assets compilés, images, polices) avec un
    # cache long. Mais des routes dynamiques comme /livewire/livewire.min.js se TERMINENT aussi par
    # .js sans exister sur le disque : sans le try_files ci-dessous, ce bloc les interceptait avant
    # même que Laravel ne les voie et renvoyait un 404 venant de Nginx, jamais de l'application.
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        try_files $uri /index.php?$query_string;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/azohub.bj/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/azohub.bj/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# Redirection HTTP -> HTTPS (posée automatiquement par `certbot --nginx` lors de l'activation
# du certificat Let's Encrypt — ne pas éditer les lignes "managed by Certbot" à la main, elles
# sont régénérées par certbot renew).
server {
    if ($host = www.azohub.bj) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = azohub.bj) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name azohub.bj www.azohub.bj 51.68.230.14;
    return 404; # managed by Certbot
}
