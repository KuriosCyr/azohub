name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # Base MySQL dédiée : l'app utilise des fonctionnalités MySQL-only (fullText,
    # YEAR()/MONTH() dans les widgets Filament) incompatibles avec SQLite — voir phpunit.xml.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: true
          MYSQL_DATABASE: azohub_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, mysql, gd, zip
          coverage: none

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Dépendances PHP
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      # Pas de `pint --test` ici volontairement : le style n'a jamais été appliqué sur ce
      # projet (des centaines de fichiers, existants avant cette CI, ne passent pas le style
      # par défaut de Pint) — l'ajouter ferait échouer la CI dès le premier run sur du code
      # sans rapport avec le changement en cours. À reconsidérer après un passage `pint` dédié.

      - name: Dépendances front-end + build
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Préparer l'environnement de test
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Attendre MySQL
        run: |
          for i in $(seq 1 30); do
            mysqladmin ping -h127.0.0.1 -uroot --silent && break
            sleep 2
          done

      - name: Tests (PHPUnit)
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: azohub_testing
          DB_USERNAME: root
          DB_PASSWORD: ""
        run: php artisan test
